<!DOCTYPE html>
<html>
<head>
<title>Special Surprise For Alia ❤️</title>

<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
padding:50px;
color:white;
}

.card{
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
max-width:600px;
margin:auto;
backdrop-filter:blur(10px);
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
background:white;
color:#ff4d6d;
font-weight:bold;
}

#message{
display:none;
margin-top:25px;
font-size:20px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="card">

<h1>❤️ A Special Surprise For Alia ❤️</h1>

<p>Hai Alia 😊</p>

<p>Saya ada sesuatu untuk awak.</p>

<button onclick="showMessage()">CLICK HERE</button>

<div id="message">

<p>
Terima kasih kerana hadir dalam hidup saya.
</p>

<p>
Semoga hari-hari awak sentiasa dipenuhi kebahagiaan,
kesihatan dan rezeki yang baik.
</p>

<p>
Jangan lupa senyum selalu ya. ❤️
</p>

<h2>From Asheeq ❤️</h2>

</div>

</div>

<script>
function showMessage(){
document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
